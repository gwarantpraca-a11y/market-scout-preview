<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anonimowa ankieta — męska higiena intymna</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#eef5f8;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.head{text-align:center;padding:28px 8px}.badge{display:inline-block;padding:7px 11px;border:1px solid #285064;border-radius:99px;color:#83dbc1;font-size:12px}.head h1{font-size:30px;margin:16px 0 8px}.head p{color:#91a9b7;line-height:1.5}.progress{height:8px;background:#152936;border-radius:20px;overflow:hidden;position:sticky;top:0;z-index:4}.fill{height:100%;width:0;background:linear-gradient(90deg,#42bda0,#66a9ff);transition:.25s}.card{background:#0d1a25;border:1px solid #1b3040;border-radius:18px;padding:24px;margin-top:18px}.step{display:none}.step.active{display:block}.num{font-size:12px;color:#6e94a8;text-transform:uppercase}.q{font-size:21px;font-weight:800;line-height:1.3;margin:8px 0 18px}.hint{color:#8fa7b5;font-size:13px;margin:-8px 0 14px}.opts{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #244052;border-radius:12px;padding:13px;cursor:pointer;background:#0a1721}.opt:hover{border-color:#4d839e}.opt input{margin-top:3px;accent-color:#42bda0}.open,.otherText{width:100%;background:#08141d;border:1px solid #294454;border-radius:12px;color:#fff;padding:13px;font:inherit}.open{min-height:120px;resize:vertical}.otherWrap{display:none;margin-top:10px}.otherWrap.show{display:block}.otherText{min-height:48px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:800;cursor:pointer}.back{background:#162a37;color:#b8c9d2}.next{background:#52c7a7;color:#052017;margin-left:auto}.next:disabled{opacity:.55;cursor:wait}.small{font-size:12px;color:#7994a7;line-height:1.5}.done{text-align:center;padding:35px 10px}.done h2{font-size:28px}.warn{color:#e9c875}.error{color:#ffb4a8;font-size:13px;min-height:18px;margin-top:10px}@media(max-width:550px){.head h1{font-size:25px}.q{font-size:19px}.card{padding:18px}}</style></head><body><div class="wrap"><div class="head"><span class="badge">ANONIMOWA • 18+ • 2–4 MINUTY</span><h1>Faceci, jak naprawdę dbacie o higienę intymną?</h1><p>Bez oceniania i bez reklamy produktu. Chcemy poznać prawdziwe nawyki, problemy i pomysły. Nie podawaj imienia, maila ani innych danych pozwalających Cię zidentyfikować.</p></div><div class="progress"><div class="fill" id="fill"></div></div><form id="survey"><div id="steps"></div></form></div><script src="survey-config.js"></script><script>
const Q=[
['Wiek?',['18–24','25–34','35–44','45–54','55–64','65+','Wolę nie podawać']],
['Jak często zwykle myjesz okolice intymne?',['Więcej niż raz dziennie','Raz dziennie','Kilka razy w tygodniu','Rzadziej','Zależy od sytuacji']],
['Czego najczęściej używasz podczas mycia?',['Samej wody','Wody i dłoni','Żelu/mydła + dłoni','Gąbki lub myjki','Innego akcesorium','Inne']],
['Czy używasz osobnego produktu lub akcesorium tylko do higieny intymnej?',['Tak','Nie','Czasami']],
['Ile czasu przeciętnie poświęcasz na samo mycie okolic intymnych?',['Poniżej 30 sekund','30–60 sekund','1–2 minuty','Ponad 2 minuty','Nie wiem']],
['Jak oceniasz dokładność obecnego sposobu mycia?',['Bardzo dobrze','Raczej dobrze','Przeciętnie','Raczej źle','Trudno powiedzieć']],
['Czy po umyciu zdarza Ci się mieć wrażenie, że okolica nie została dokładnie oczyszczona?',['Często','Czasami','Rzadko','Nigdy','Trudno powiedzieć']],
['Co najbardziej utrudnia Ci higienę intymną?',['Brak trudności','Dostęp do niektórych miejsc','Napletek','Włosy','Wrażliwa skóra','Podrażnienia po myciu','Zapach','Pośpiech','Brak odpowiedniego akcesorium','Inne'],'multi'],
['Czy zdarzają Ci się podrażnienia, pieczenie lub dyskomfort po myciu?',['Często','Czasami','Rzadko','Nigdy','Wolę nie odpowiadać']],
['Czy zdarza Ci się zauważyć nieprzyjemny zapach mimo regularnego mycia?',['Często','Czasami','Rzadko','Nigdy','Wolę nie odpowiadać']],
['Czy partnerka/partner kiedykolwiek zwrócił(a) Ci uwagę na zapach lub higienę okolic intymnych?',['Tak','Nie','Nie dotyczy','Wolę nie odpowiadać']],
['Jeśli masz napletek: czy jego odciągnięcie podczas mycia jest dla Ciebie swobodne?',['Tak','Częściowo','Sprawia trudność lub dyskomfort','Nie dotyczy','Wolę nie odpowiadać']],
['Skąd czerpałeś wiedzę o prawidłowej higienie intymnej?',['Rodzice/opiekunowie','Szkoła','Lekarz','Partnerka/partner','Internet/media','Sam wypracowałem swoje nawyki','Inne'],'multi'],
['Czy uważasz, że mężczyźni mają wystarczająco dużo rzetelnej wiedzy o higienie intymnej?',['Zdecydowanie tak','Raczej tak','Raczej nie','Zdecydowanie nie','Nie wiem']],
['Czy kiedykolwiek szukałeś specjalnej myjki lub akcesorium do higieny męskich okolic intymnych?',['Tak i znalazłem','Tak, ale nic odpowiedniego nie znalazłem','Nie','Nie wiedziałem, że takie rozwiązania mogą istnieć']],
['Gdyby istniała specjalna bardzo miękka myjka do tych okolic, co byłoby dla Ciebie najważniejsze?',['Delikatność','Dokładność mycia','Łatwe płukanie','Szybkie schnięcie','Higieniczność','Wygodny chwyt','Mały rozmiar','Trwałość','Cena','Dyskretny wygląd','Możliwość użycia pod prysznicem','Inne'],'multi'],
['Co zniechęciłoby Cię do używania specjalnej myjki?',['Obawa przed podrażnieniem','Trudność w utrzymaniu czystości','Długie schnięcie','Cena','Wstyd lub skojarzenia','Brak potrzeby','Niewygodny kształt','Inne'],'multi'],
['Jak często — gdyby rozwiązanie było wygodne i delikatne — realnie byś go używał?',['Przy każdym prysznicu','Kilka razy w tygodniu','Okazjonalnie','Raczej nigdy','Nie wiem']],
['Wyobraź sobie idealną myjkę do męskich okolic intymnych. Jak powinna wyglądać i działać?',null,'open','To jedyne dłuższe pytanie. Wystarczy jedna cecha albo krótkie zdanie.'],
['Gdybyś mógł zmienić jedną rzecz w codziennej higienie intymnej, co by to było?',null,'open','Krótka odpowiedź wystarczy.'],
['Czy jest coś w tym temacie, o co nikt zwykle nie pyta, a Twoim zdaniem powinien?',null,'open','Krótka odpowiedź wystarczy.']];
const steps=document.getElementById('steps');
const esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
Q.forEach((x,i)=>{const d=document.createElement('section');d.className='card step'+(i===0?' active':'');let html=`<div class="num">Pytanie ${i+1} z ${Q.length}</div><div class="q">${esc(x[0])}</div>${x[3]?`<div class="hint">${esc(x[3])}</div>`:''}`;if(x[2]==='open'){html+=`<textarea maxlength="1000" class="open" name="q${i+1}" placeholder="Twoja odpowiedź..."></textarea>`}else{html+='<div class="opts">'+x[1].map(o=>`<label class="opt"><input type="${x[2]==='multi'?'checkbox':'radio'}" name="q${i+1}" value="${esc(o)}" data-other="${o==='Inne'?'1':'0'}"><span>${esc(o)}</span></label>`).join('')+'</div>';if(x[1].includes('Inne'))html+=`<div class="otherWrap"><input maxlength="300" class="otherText" name="q${i+1}_inne" placeholder="Napisz własną odpowiedź..."></div>`}html+=`<div class="error"></div><div class="nav">${i?'<button type="button" class="btn back">Wstecz</button>':''}<button type="button" class="btn next">${i===Q.length-1?'Wyślij':'Dalej'}</button></div>`;d.innerHTML=html;steps.appendChild(d)});
let cur=0,sending=false;const all=[...document.querySelectorAll('.step')];
function show(n){all[cur].classList.remove('active');cur=n;all[cur].classList.add('active');document.getElementById('fill').style.width=(cur/Q.length*100)+'%';scrollTo({top:130,behavior:'smooth'})}
document.addEventListener('change',e=>{if(!e.target.matches('input[data-other]'))return;const s=e.target.closest('.step'),w=s.querySelector('.otherWrap');if(!w)return;const on=[...s.querySelectorAll('input[data-other="1"]')].some(x=>x.checked);w.classList.toggle('show',on);if(!on)w.querySelector('.otherText').value=''});
document.addEventListener('click',async e=>{if(e.target.classList.contains('back')&&!sending)show(cur-1);if(e.target.classList.contains('next')&&!sending){const s=all[cur],open=s.querySelector('textarea'),checked=s.querySelectorAll('input:checked'),other=[...s.querySelectorAll('input[data-other="1"]')].some(x=>x.checked),ot=s.querySelector('.otherText');let ok=open?open.value.trim().length>0:checked.length>0;if(ok&&other&&ot&&!ot.value.trim())ok=false;if(!ok){s.querySelector('.error').textContent=other?'Wpisz swoją odpowiedź w polu „Inne”.':'Wybierz odpowiedź lub wpisz swoją odpowiedź.';return}s.querySelector('.error').textContent='';if(cur<Q.length-1)show(cur+1);else await finish(e.target)}});
function collect(){const a={};new FormData(document.getElementById('survey')).forEach((v,k)=>{if(a[k])a[k]=[].concat(a[k],v);else a[k]=v});return a}
async function finish(btn){const cfg=window.SURVEY_CONFIG||{};if(!cfg.enabled||!cfg.supabaseUrl||!cfg.supabaseAnonKey){all[cur].querySelector('.error').textContent='Ankieta jest jeszcze w trybie testowym — zapis do bazy nie został włączony.';return}if(localStorage.getItem('inti-survey-submitted-v1')){steps.innerHTML='<div class="card done"><h2>Dziękujemy.</h2><p>Z tego urządzenia odpowiedź została już wcześniej wysłana.</p></div>';return}sending=true;btn.disabled=true;btn.textContent='Wysyłam…';const source=new URLSearchParams(location.search).get('src')||document.referrer||'direct';const payload={source:String(source).slice(0,250),answers:collect()};try{const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+encodeURIComponent(cfg.table||'inti_survey_responses'),{method:'POST',headers:{'apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());localStorage.setItem('inti-survey-submitted-v1','1');document.getElementById('fill').style.width='100%';steps.innerHTML='<div class="card done"><h2>Dziękujemy.</h2><p>Odpowiedź została anonimowo zapisana.</p><p class="small">Nie zbieramy w formularzu imienia ani adresu e-mail.</p></div>'}catch(err){console.error(err);all[cur].querySelector('.error').textContent='Nie udało się wysłać odpowiedzi. Spróbuj ponownie za chwilę.';btn.disabled=false;btn.textContent='Wyślij';sending=false}}
</script></body></html>
