<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTI Survey — wyniki</title><style>body{margin:0;background:#071019;color:#eef5f8;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:36px 18px}.card{background:#0d1a25;border:1px solid #1b3040;border-radius:18px;padding:24px;margin:16px 0}.big{font-size:52px;font-weight:900}.muted{color:#8fa7b5}.err{color:#ffb4a8}.pill{display:inline-block;padding:6px 10px;border:1px solid #285064;border-radius:99px;color:#83dbc1;font-size:12px}</style></head><body><div class="wrap"><span class="pill">PUBLIC SURVEY 01</span><h1>Stan ankiety</h1><div class="card"><div class="muted">Liczba zapisanych odpowiedzi</div><div id="count" class="big">—</div><div id="last" class="muted">Ładowanie…</div></div><div class="card muted">Ta strona pokazuje wyłącznie zagregowany licznik. Surowe odpowiedzi nie są publicznie udostępniane.</div><div id="err" class="err"></div></div><script src="survey-config.js"></script><script>async function load(){const c=window.SURVEY_CONFIG||{},e=document.getElementById('err');if(!c.enabled||!c.supabaseUrl||!c.supabaseAnonKey){e.textContent='Backend ankiety nie jest jeszcze aktywny.';return}try{const r=await fetch(c.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/inti_survey_summary',{method:'POST',headers:{apikey:c.supabaseAnonKey,Authorization:'Bearer '+c.supabaseAnonKey,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw new Error(await r.text());const d=await r.json();document.getElementById('count').textContent=d.responses??0;document.getElementById('last').textContent=d.last_response_at?'Ostatnia odpowiedź: '+new Date(d.last_response_at).toLocaleString('pl-PL'):'Brak odpowiedzi';}catch(x){console.error(x);e.textContent='Nie udało się pobrać danych.'}}load();</script></body></html>
